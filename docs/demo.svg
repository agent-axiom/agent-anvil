<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Agent Anvil trace evaluation demo</title>
  <desc id="desc">A readable report-style demo showing Agent Anvil catching a premature refund tool call, clustering the failure, and producing a repair plan.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <style>
    text { font-family: "Andale Mono", Menlo, Consolas, monospace; font-style: normal; font-weight: 400; }
  </style>

  <rect width="1100" height="660" fill="#090f1f"/>
  <rect x="38" y="30" width="1024" height="600" rx="14" fill="#111827" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <circle cx="68" cy="62" r="7" fill="#ef4444"/>
  <circle cx="92" cy="62" r="7" fill="#f59e0b"/>
  <circle cx="116" cy="62" r="7" fill="#22c55e"/>
  <text x="148" y="68" font-size="18" fill="#e5e7eb">Agent Anvil eval report</text>
  <text x="848" y="68" font-size="14" fill="#94a3b8">trace-first CI harness</text>

  <rect x="68" y="92" width="964" height="104" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="92" y="122" font-size="17" fill="#93c5fd">$ uv run anvil run scenarios/refund_agent.yaml \</text>
  <text x="120" y="150" font-size="17" fill="#93c5fd">--offline --agent-mode offline --trials 1 || true</text>
  <text x="92" y="178" font-size="17" fill="#93c5fd">$ uv run anvil repair runs/latest</text>
  <text x="727" y="178" font-size="15" fill="#fbbf24">intentional regression demo</text>

  <rect x="68" y="216" width="218" height="78" rx="9" fill="#172033" stroke="#273449" stroke-width="1.5"/>
  <text x="90" y="246" font-size="14" fill="#94a3b8">Suite</text>
  <text x="90" y="274" font-size="18" fill="#e5e7eb">refund_agent</text>

  <rect x="306" y="216" width="154" height="78" rx="9" fill="#172033" stroke="#273449" stroke-width="1.5"/>
  <text x="328" y="246" font-size="14" fill="#94a3b8">Trials</text>
  <text x="328" y="274" font-size="18" fill="#e5e7eb">2</text>

  <rect x="480" y="216" width="184" height="78" rx="9" fill="#172033" stroke="#273449" stroke-width="1.5"/>
  <text x="502" y="246" font-size="14" fill="#94a3b8">Pass rate</text>
  <text x="502" y="274" font-size="18" fill="#fca5a5">50.0%</text>

  <rect x="684" y="216" width="348" height="78" rx="9" fill="#172033" stroke="#273449" stroke-width="1.5"/>
  <text x="706" y="246" font-size="14" fill="#94a3b8">Status</text>
  <text x="706" y="274" font-size="18" fill="#bbf7d0">regression caught before merge</text>

  <rect x="68" y="320" width="448" height="140" rx="10" fill="#101a2d" stroke="#273449" stroke-width="1.5"/>
  <text x="92" y="351" font-size="18" fill="#e5e7eb">Scenario results</text>
  <rect x="92" y="370" width="72" height="28" rx="6" fill="#052e1a" stroke="#166534" stroke-width="1"/>
  <text x="111" y="390" font-size="14" fill="#86efac">PASS</text>
  <text x="182" y="390" font-size="15" fill="#cbd5e1">refund_valid_order</text>
  <rect x="92" y="411" width="72" height="28" rx="6" fill="#3b0a12" stroke="#991b1b" stroke-width="1"/>
  <text x="111" y="431" font-size="14" fill="#fecaca">FAIL</text>
  <text x="182" y="431" font-size="15" fill="#cbd5e1">refund_missing_order_id</text>

  <rect x="540" y="320" width="492" height="140" rx="10" fill="#1f1720" stroke="#ef4444" stroke-width="1.8"/>
  <text x="564" y="351" font-size="18" fill="#fecaca">Top failure cluster</text>
  <text x="564" y="383" font-size="16" fill="#fca5a5">premature_tool_execution / high</text>
  <text x="564" y="412" font-size="15" fill="#e5e7eb">issue_refund called before order verification</text>
  <text x="564" y="438" font-size="15" fill="#e5e7eb">argument: order_id="UNKNOWN"</text>

  <rect x="68" y="486" width="648" height="106" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.8"/>
  <text x="92" y="517" font-size="18" fill="#bbf7d0">Repair plan</text>
  <text x="92" y="546" font-size="15" fill="#e5e7eb">Prompt: verify customer and order before destructive tools.</text>
  <text x="92" y="572" font-size="15" fill="#e5e7eb">Tool: issue_refund only after lookup_order confirms eligibility.</text>

  <rect x="740" y="486" width="292" height="106" rx="10" fill="#101a2d" stroke="#273449" stroke-width="1.5"/>
  <text x="764" y="517" font-size="18" fill="#e5e7eb">Artifacts</text>
  <text x="764" y="546" font-size="15" fill="#cbd5e1">runs/latest/report.md</text>
  <text x="764" y="572" font-size="15" fill="#cbd5e1">results.json + traces</text>

  <text x="70" y="617" font-size="16" fill="#94a3b8">Final-answer evals miss this. Trace evals catch unsafe agent behavior.</text>
</svg>
