[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-anvil"
version = "0.2.18"
description = "CI-first evaluation harness for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Agent Anvil contributors" }]
dependencies = [
  "jinja2>=3.1.6",
  "openai>=2.9.0",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "typer>=0.20.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=4.0.1",
  "pytest-sugar>=1.1.1",
  "ruff>=0.15.0",
  "ty>=0.0.1a23",
]

[project.scripts]
anvil = "anvil.cli:app"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["anvil", "examples"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=anvil",
  "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ty.environment]
python-version = "3.12"
root = ["."]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
