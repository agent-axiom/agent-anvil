name: Agent Anvil
description: Run Agent Anvil scenario suites in GitHub Actions.
branding:
  icon: activity
  color: purple

inputs:
  scenario:
    description: Path to the Agent Anvil YAML scenario suite.
    required: true
  runs-dir:
    description: Directory where run artifacts should be written.
    required: false
    default: runs/agent-anvil
  offline:
    description: Use local heuristic semantic grading instead of OpenAI grading.
    required: false
    default: "false"
  agent-mode:
    description: Demo agent mode, such as offline, openai, or auto.
    required: false
    default: ""
  trials:
    description: Optional trial-count override.
    required: false
    default: ""
  expected-exit-code:
    description: Expected anvil run exit code. Use 1 for intentional regression demos.
    required: false
    default: "0"
  github-summary:
    description: Append a Markdown run summary to GITHUB_STEP_SUMMARY.
    required: false
    default: "true"
  pr-comment:
    description: Write PR-ready Markdown for optional gh pr comment publishing.
    required: false
    default: "false"
  post-pr-comment:
    description: Publish the generated PR comment with gh pr comment during pull_request workflows.
    required: false
    default: "false"
  pr-comment-path:
    description: Path for the generated PR comment Markdown file.
    required: false
    default: agent-anvil-pr-comment.md
  compare-baseline:
    description: Optional baseline run directory for compare-aware PR comments.
    required: false
    default: ""
  compare-path:
    description: Path for the generated compare JSON artifact.
    required: false
    default: agent-anvil-compare.json
  python-version:
    description: Python version used by uv for running Agent Anvil.
    required: false
    default: "3.12"
  uv-cache:
    description: Enable setup-uv caching. Keep false when invoking this action multiple times in one job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: ${{ inputs.uv-cache }}
        python-version: ${{ inputs.python-version }}

    - name: Run Agent Anvil
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        scenario="${{ inputs.scenario }}"
        runs_dir="${{ inputs.runs-dir }}"

        if [[ "$scenario" != /* ]]; then
          scenario="$GITHUB_WORKSPACE/$scenario"
        fi
        if [[ "$runs_dir" != /* ]]; then
          runs_dir="$GITHUB_WORKSPACE/$runs_dir"
        fi

        cd "$GITHUB_WORKSPACE"

        args=(run "$scenario" --runs-dir "$runs_dir")
        if [[ "${{ inputs.offline }}" == "true" ]]; then
          args+=(--offline)
        fi
        if [[ -n "${{ inputs.agent-mode }}" ]]; then
          args+=(--agent-mode "${{ inputs.agent-mode }}")
        fi
        if [[ -n "${{ inputs.trials }}" ]]; then
          args+=(--trials "${{ inputs.trials }}")
        fi

        set +e
        uv run --project "$GITHUB_ACTION_PATH" --frozen anvil "${args[@]}"
        exit_code=$?
        set -e

        if [[ "$exit_code" != "${{ inputs.expected-exit-code }}" ]]; then
          echo "Agent Anvil exited with $exit_code, expected ${{ inputs.expected-exit-code }}."
          exit 1
        fi

        if [[ "$exit_code" != "0" ]]; then
          uv run --project "$GITHUB_ACTION_PATH" --frozen anvil repair "$runs_dir/latest"
        fi

        if [[ "${{ inputs.github-summary }}" == "true" && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          uv run --project "$GITHUB_ACTION_PATH" --frozen anvil summary "$runs_dir/latest" --github >> "$GITHUB_STEP_SUMMARY"
        fi

        compare_path=""
        if [[ -n "${{ inputs.compare-baseline }}" ]]; then
          baseline_dir="${{ inputs.compare-baseline }}"
          if [[ "$baseline_dir" != /* ]]; then
            baseline_dir="$GITHUB_WORKSPACE/$baseline_dir"
          fi
          compare_path="${{ inputs.compare-path }}"
          if [[ "$compare_path" != /* ]]; then
            compare_path="$GITHUB_WORKSPACE/$compare_path"
          fi
          uv run --project "$GITHUB_ACTION_PATH" --frozen anvil compare "$baseline_dir" "$runs_dir/latest" --out "$compare_path"
        fi

        if [[ "${{ inputs.pr-comment }}" == "true" || "${{ inputs.post-pr-comment }}" == "true" ]]; then
          comment_path="${{ inputs.pr-comment-path }}"
          if [[ "$comment_path" != /* ]]; then
            comment_path="$GITHUB_WORKSPACE/$comment_path"
          fi
          pr_args=(pr-comment "$runs_dir/latest" --out "$comment_path")
          if [[ -n "$compare_path" ]]; then
            pr_args+=(--compare "$compare_path")
          fi
          uv run --project "$GITHUB_ACTION_PATH" --frozen anvil "${pr_args[@]}"
        fi

        if [[ "${{ inputs.post-pr-comment }}" == "true" ]]; then
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Skipping PR comment publish outside pull_request event."
          else
            pr_number="${{ github.event.pull_request.number }}"
            if [[ -z "$pr_number" ]]; then
              echo "Skipping PR comment publish because pull request number is unavailable."
            else
              gh pr comment "$pr_number" --body-file "$comment_path"
            fi
          fi
        fi
