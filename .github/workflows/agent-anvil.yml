name: Agent Anvil

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-eval:
    name: Demo Eval
    runs-on: ubuntu-latest
    env:
      ANVIL_OFFLINE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run passing external agent eval
        uses: ./
        with:
          scenario: scenarios/external_jsonl_agent.yaml
          offline: "true"
          runs-dir: runs/external

      - name: Run intentional refund regression demo
        uses: ./
        with:
          scenario: scenarios/refund_agent.yaml
          offline: "true"
          agent-mode: offline
          trials: "1"
          runs-dir: runs/refund
          expected-exit-code: "1"

      - name: Upload Agent Anvil run artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-anvil-runs
          path: runs/
          if-no-files-found: error
