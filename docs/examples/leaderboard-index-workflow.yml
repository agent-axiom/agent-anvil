name: Validate Agent Anvil Leaderboard

on:
  pull_request:
    paths:
      - "submissions/**/*.json"
      - "leaderboard.csv"
      - "leaderboard.json"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Validate stable submission contracts
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.70 \
            anvil schema validate-dir submissions
      - name: Validate stable maintainer rerun contracts
        if: hashFiles('maintainer_reruns/**/*.json') != ''
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.70 \
            anvil schema validate-dir maintainer_reruns \
            --schema agent-anvil.leaderboard.maintainer_rerun.v1 \
            --recursive
      - name: Validate submissions and build index
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.70 \
            anvil leaderboard build submissions \
            --out leaderboard.csv \
            --json-out leaderboard.json \
            --no-artifacts \
            --github-run
      - name: Write GitHub run verification reports
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.70 \
            anvil leaderboard verify-all submissions \
            --out github-run-verifications \
            --index-out github-run-verifications.json \
            --maintainer-reruns maintainer_reruns
      - name: Audit leaderboard decisions
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.70 \
            anvil leaderboard audit submissions \
            --json-out leaderboard_audit.json \
            --markdown-out leaderboard_audit.md \
            --maintainer-reruns maintainer_reruns \
            --fail-on reject \
            --github-run
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: agent-anvil-leaderboard-index
          path: |
            leaderboard.csv
            leaderboard.json
            github-run-verifications
            github-run-verifications.json
            leaderboard_audit.json
            leaderboard_audit.md
