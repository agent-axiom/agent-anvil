name: Agent Anvil

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-eval:
    name: Demo Eval
    runs-on: ubuntu-latest
    env:
      ANVIL_OFFLINE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run passing external agent eval
        uses: agent-axiom/agent-anvil-action@v1.0.3
        with:
          scenario: scenarios/external_jsonl_agent.yaml
          offline: "true"
          runs-dir: runs/external

      - name: Run intentional refund regression demo
        uses: agent-axiom/agent-anvil-action@v1.0.3
        with:
          scenario: scenarios/refund_agent.yaml
          offline: "true"
          agent-mode: offline
          trials: "1"
          runs-dir: runs/refund
          expected-exit-code: "1"
          pr-comment: "true"
          pr-comment-path: agent-anvil-pr-comment.md

      - name: Harden demo MCP server
        run: |
          uv run --frozen anvil mcp harden \
            --command-json '["python", "docs/examples/fake_mcp_server.py"]' \
            --snapshot-out reports/mcp/mcp-tools.json \
            --audit-out reports/mcp/mcp_tool_safety.yaml \
            --audit-report reports/mcp/mcp-audit.md \
            --repair-out reports/mcp/mcp-repair.md \
            --offline \
            --github-summary

      - name: Upload Agent Anvil run artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-anvil-runs
          path: |
            runs/
            reports/mcp/
            agent-anvil-pr-comment.md
          if-no-files-found: error
