services:
  anvil:
    build: .
    environment:
      ANVIL_OFFLINE: "${ANVIL_OFFLINE:-true}"
      ANVIL_OPENAI_MODEL: "${ANVIL_OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - ./runs:/app/runs
    command: ["anvil", "run", "scenarios/refund_agent.yaml", "--offline"]
