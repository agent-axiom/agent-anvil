name: Validate Agent Anvil Leaderboard

on:
  pull_request:
    paths:
      - "submissions/**/*.json"
      - "leaderboard.csv"
      - "leaderboard.json"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Validate submissions and build index
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil \
            anvil leaderboard build submissions \
            --out leaderboard.csv \
            --json-out leaderboard.json \
            --no-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-anvil-leaderboard-index
          path: |
            leaderboard.csv
            leaderboard.json
