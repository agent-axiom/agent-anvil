name: Validate Agent Anvil Leaderboard

on:
  pull_request:
    paths:
      - "submissions/**/*.json"
      - "leaderboard.csv"
      - "leaderboard.json"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Validate submissions and build index
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.42 \
            anvil leaderboard build submissions \
            --out leaderboard.csv \
            --json-out leaderboard.json \
            --no-artifacts \
            --github-run
      - name: Write GitHub run verification reports
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.42 \
            anvil leaderboard verify-all submissions \
            --out github-run-verifications
      - name: Audit leaderboard decisions
        run: |
          uvx --from git+https://github.com/agent-axiom/agent-anvil@v0.2.42 \
            anvil leaderboard audit submissions \
            --json-out leaderboard_audit.json \
            --markdown-out leaderboard_audit.md \
            --fail-on reject \
            --github-run
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: agent-anvil-leaderboard-index
          path: |
            leaderboard.csv
            leaderboard.json
            github-run-verifications
            leaderboard_audit.json
            leaderboard_audit.md
